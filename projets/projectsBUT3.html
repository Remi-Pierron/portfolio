    <style>
        /* Styles pour les sections */
        .projects-section {
            margin: 40px 0;
        }

        .projects-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #000000;
        }

        /* Styles pour les cartes de projets */
        .projects-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .project-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            width: 300px;
        }

        .project-card img {
            width: 100%;
            height: auto;
        }

        .project-card h3 {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }

        .project-card a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #000000;
            transition: background-color 0.3s, color 0.3s;
        }

        .project-card a:hover {
            background-color: #000000;
            color: #fff;
        }
    </style>
</head>
